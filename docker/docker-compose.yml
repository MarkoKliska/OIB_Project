services:
  postgres:
    image: postgres:16-alpine
    container_name: autoservice_postgres
    environment:
      POSTGRES_USER: autoservice_user
      POSTGRES_PASSWORD: autoservice_pass
      POSTGRES_DB: autoservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoservice_user -d autoservice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: autoservice_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@autoservice.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data: